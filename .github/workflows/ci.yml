name: CI

on:
  push:
    branches:
      - main
      - 'features/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:
              - 'services/catalog/**'
              - 'proto/catalog/**'
            auth:
              - 'services/auth/**'
              - 'proto/auth/**'
            booking:
              - 'services/booking/**'
              - 'proto/booking/**'
            notification:
              - 'services/notification/**'
              - 'proto/notification/**'
            shared:
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - '.github/workflows/**'
              - 'deployments/**'
              - 'gateaway/**'

      - name: Build test matrix
        id: matrix
        run: |
          ALL='["catalog","auth","booking","notification"]'
          CHANGES='${{ steps.filter.outputs.changes }}'

          echo "Changed areas: $CHANGES"

          if echo "$CHANGES" | jq -e 'index("shared")' > /dev/null; then
            MATRIX="$ALL"
          else
            MATRIX=$(jq -c -n \
              --argjson all "$ALL" \
              --argjson changes "$CHANGES" \
              '[ $all[] | select($changes | index(.)) ]')
          fi

          echo "Test matrix: $MATRIX"
          echo "services=$MATRIX" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod / go.sum tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files are not gofmt-ed:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: ${{ matrix.dir }}
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d eventix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST_TEST: localhost
      DB_PORT_TEST: "5432"
      DB_USER_TEST: test
      DB_PASSWORD_TEST: test
      DB_NAME_TEST: eventix_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply migrations
        run: |
          SERVICE="${{ matrix.service }}"

          MIGRATIONS_DIR=""
          if [ -d "migrations" ]; then
            MIGRATIONS_DIR="migrations"
          fi

          if [ -n "$MIGRATIONS_DIR" ]; then
            echo "Applying migrations from $MIGRATIONS_DIR"
            go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest \
              -path "$MIGRATIONS_DIR" \
              -database "postgres://test:test@localhost:5432/eventix_test?sslmode=disable" up
          else
            echo "No migrations directory for $SERVICE yet"
          fi

      - name: Run service tests
        run: |
          SERVICE="${{ matrix.service }}"

          if [ -f "services/$SERVICE/go.mod" ]; then
            echo "== testing services/$SERVICE"
            cd "services/$SERVICE"
            go test -race -count=1 ./...
          else
            echo "services/$SERVICE has no go.mod yet, skipping tests"
          fi

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, lint, build, test]
    steps:
      - name: Check job results
        run: |
          echo "Job results: ${{ join(needs.*.result, ', ') }}"

          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Some CI jobs failed"
            exit 1
          fi

          echo "CI passed"