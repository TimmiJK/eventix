name: CI

on:
  push:
    branches:
      - main
      - 'features/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:
              - 'services/catalog/**'
              - 'proto/catalog/**'
            auth:
              - 'services/auth/**'
              - 'proto/auth/**'
            booking:
              - 'services/booking/**'
              - 'proto/booking/**'
            notification:
              - 'services/notification/**'
              - 'proto/notification/**'
            gateway:
              - 'gateway/**'
            shared:
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - '.github/workflows/**'
              - 'deployments/**'

      - name: Build test matrix
        id: matrix
        run: |
          ALL='["catalog","auth","booking","notification"]'
          CHANGES='${{ steps.filter.outputs.changes }}'

          echo "Changed areas: $CHANGES"

          if echo "$CHANGES" | jq -e 'index("shared")' > /dev/null; then
            MATRIX="$ALL"
          else
            MATRIX=$(jq -c -n \
              --argjson all "$ALL" \
              --argjson changes "$CHANGES" \
              '[ $all[] | select($changes | index(.)) ]')
          fi

          echo "Test matrix: $MATRIX"
          echo "services=$MATRIX" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod / go.sum tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files are not gofmt-ed:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DB_NAME_TEST: eventix_test
      DB_USER_TEST: test
      DB_PASSWORD_TEST: test
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Docker availability
        run: |
          docker --version
          docker info

      - name: Run service tests
        run: |
          SERVICE="${{ matrix.service }}"
          if [ -f "services/$SERVICE/go.mod" ]; then
            echo "== testing services/$SERVICE with testcontainers"
            cd "services/$SERVICE"
            go test -race -count=1 -v ./...
          else
            echo "services/$SERVICE has no go.mod yet, skipping tests"
          fi
        timeout-minutes: 10
  
  test-gateway:
    name: Test Gateway
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.gateway == 'true' || needs.changes.outputs.services != '[]') }}

    env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DB_NAME_TEST: eventix_test
          DB_USER_TEST: test
          DB_PASSWORD_TEST: test
          CGO_ENABLED: 1
          
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Docker availability
        run: |
          docker --version
          docker info

      - name: Run gateway tests
        run: |
          echo "== Running gateway tests with testcontainers"
          cd gateway
          go test -race -count=1 -v ./...
        timeout-minutes: 10

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, lint, build, test-services, test-gateway]
    steps:
      - name: Check job results
        run: |
          echo "Job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  test: ${{ needs.test-services.result }}"
          echo "  test-gateway: ${{ needs.test-gateway.result }}"
          if [ "${{ needs.changes.result }}" = "failure" ] || \
             [ "${{ needs.changes.result }}" = "cancelled" ] || \
             [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.lint.result }}" = "cancelled" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "cancelled" ] || \
             [ "${{ needs.test-services.result }}" = "failure" ] || \
             [ "${{ needs.test-services.result }}" = "cancelled" ] || \
             [ "${{ needs.test-gateway.result }}" = "failure" ] || \
             [ "${{ needs.test-gateway.result }}" = "cancelled" ]; then
            echo "Some CI jobs failed"
            exit 1
          fi
          echo "CI passed"